# 本地密钥模板
# ---------------------------------------------------------------
# 使用方法：
#   1. 复制本文件为 config/local-secrets.yml（该文件已被 .gitignore 排除）
#   2. 填入你自己的 API Key
#   3. 启动时加载：
#      java -jar target/order-agent-1.0.0.jar \
#        --spring.config.additional-location=optional:file:./config/local-secrets.yml
# ---------------------------------------------------------------

order-agent:
  llm:
    provider: openai                          # mock | openai（任何 OpenAI 兼容网关）
    base-url: https://api.siliconflow.cn/v1   # 硅基流动；也可换成 DeepSeek 官方 / 阿里通义等
    api-key: sk-替换成你自己的Key
    model: deepseek-ai/DeepSeek-V4.1-Flash
    temperature: 0.2
    fallback: abort                           # 评测时真实模型失败就失败，不用 mock 掩盖
    max-retries: 5                            # 429 限流时指数退避重试
    price-in-per-m-tokens: 0.0                # 按你的模型实际价格填写，用于成本核算
    price-out-per-m-tokens: 0.0

    # 裁判模型（评测用）。留空 api-key 则自动回落 mock
    judge:
      enabled: true
      provider: openai
      base-url: https://api.siliconflow.cn/v1
      api-key: sk-替换成你自己的Key
      model: deepseek-ai/DeepSeek-V4.1-Flash

  sandbox:
    allow-runtime-switch: true                # 是否允许 HTTP 接口热切换模型（生产必须关闭）

  eval:
    concurrency: 4                            # 评测并发；免费额度建议降到 2 避免触发 TPM 限流